on:
    pull_request:
      branches:
        - main
      types: [labeled, unlabeled, closed, reopened, synchronize]
    push:
      branches:
        - main

permissions:
    contents: write      # create/delete the target and lock branches
    pull-requests: write # manage labels and comments on PRs
    actions: read        # check whether a stale lock's owning run is still active

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - uses: deliveroo/merge-pr-to-branch@v6
